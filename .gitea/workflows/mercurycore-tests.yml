name: MercuryCore Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  swift-test:
    name: swift test (Packages/MercuryCore)
    # Requires a Gitea act_runner registered in host mode on a Mac with the
    # "macos" label. The test suite uses Network.framework and the Keychain,
    # so it cannot build or run on Linux runners.
    runs-on: macos
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run MercuryCore tests
        run: swift test --package-path Packages/MercuryCore
