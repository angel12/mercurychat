name: App Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  xcode-test:
    name: xcodebuild test (MercuryTests)
    # Same self-hosted host-mode runner as the MercuryCore workflow (label
    # "macos"), but this job needs FULL Xcode rather than just the Command
    # Line Tools: MercuryTests is an Xcode target, so `swift test` can't see
    # it and only xcodebuild can drive it. Host mode has no Node.js, so this
    # clones with git instead of actions/checkout.
    #
    # Kept in its own workflow rather than added as a second job to
    # mercurycore-tests.yml so the existing "MercuryCore Tests" check keeps
    # its name and history. The runner's capacity is 1, so the two workflows
    # queue and run one after the other.
    runs-on: macos
    steps:
      - name: Check out repository
        run: |
          git init
          git remote add origin "${{ gitea.server_url }}/${{ gitea.repository }}.git"
          git fetch --depth 1 origin "${{ gitea.ref }}"
          git checkout --force FETCH_HEAD
      - name: Xcode version
        run: xcodebuild -version
      - name: Check the committed project is current
        # Mercury.xcodeproj is generated by XcodeGen from project.yml but
        # committed, and the runner has neither xcodegen nor Homebrew to
        # regenerate it. XcodeGen lists every source file individually, so a
        # test file added to MercuryTests/ without a re-run of xcodegen is
        # simply absent from the bundle — the suite would then pass green
        # having never compiled it. Fail loudly instead of reporting a false
        # green. (The reverse drift — an app source added to the target's
        # `sources` but not regenerated — is self-detecting: the tests that
        # reference it fail to compile.)
        run: |
          missing=0
          for f in MercuryTests/*.swift; do
            if ! grep -q "$(basename "$f")" Mercury.xcodeproj/project.pbxproj; then
              echo "::error::$f is missing from Mercury.xcodeproj — run 'xcodegen' and commit the result"
              missing=1
            fi
          done
          exit $missing
      - name: Run MercuryTests
        # The scheme isn't committed (xcuserdata is gitignored); xcodebuild
        # autocreates it from the target on a fresh checkout.
        #
        # Deliberately no -quiet: it suppresses the "Test run with N tests
        # passed" summary, which is the only evidence the tests actually ran.
        # Deliberately no pipe to a log filter either — that would mask
        # xcodebuild's exit code and let a failing suite report success.
        run: xcodebuild -project Mercury.xcodeproj -scheme MercuryTests -destination 'platform=macOS' test
