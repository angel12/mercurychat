name: Mercury
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    visionOS: "2.0"
  xcodeVersion: "16.0"
packages:
  MercuryCore:
    path: Packages/MercuryCore
targets:
  MercuryTests:
    # App-layer tests (AppModel glue). Compiles the UI-free app sources
    # directly — no host app, so they run headless on macOS like the
    # package's real-socket tests.
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Mercury/AppModel.swift
      - path: Mercury/ChatController.swift
      - path: Mercury/ComposerAttachments.swift
      - path: Mercury/ImageAttachmentPreparer.swift
      - path: Mercury/ImagePasteboardReader.swift
      - path: MercuryTests
    dependencies:
      - package: MercuryCore
        products:
          - MercuryKit
          - ChatCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.spencermcguire.mercurychat.MercuryTests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  Mercury:
    type: application
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - Mercury
    dependencies:
      - package: MercuryCore
        products:
          - MercuryKit
          - ChatCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2,7"
        PRODUCT_BUNDLE_IDENTIFIER: com.spencermcguire.mercurychat
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z4JCFHY88D
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xros*]": AppIconVision
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xrsimulator*]": AppIconVision
    info:
      path: Mercury/Info.plist
      properties:
        CFBundleDisplayName: Mercury Chat
        CFBundleName: Mercury Chat
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: >-
          Mercury Chat connects to Hermes Agent servers running on your local
          network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Mercury/Mercury.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # The native-PKCE sign-in binds a loopback NWListener for the OAuth
        # redirect; a sandboxed macOS app can't listen without this. (The
        # com.apple.security.* keys are macOS App Sandbox entitlements —
        # iOS/visionOS ignore them, so the file is safely shared.)
        com.apple.security.network.server: true
        # Sandboxed fileImporter on macOS returns security-scoped URLs
        # only with this; iOS/visionOS ignore it.
        com.apple.security.files.user-selected.read-only: true
